<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="520" rx="24" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="520" />
    <line x1="320" y1="0" x2="320" y2="520" />
    <line x1="480" y1="0" x2="480" y2="520" />
    <line x1="640" y1="0" x2="640" y2="520" />
  </g>

  <!-- Central Code Terminal Window -->
  <g filter="url(#shadow)">
    <rect x="70" y="60" width="660" height="400" rx="16" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect x="70" y="60" width="660" height="42" rx="16" fill="#1e293b" />
    <circle cx="100" cy="81" r="6" fill="#ef4444" />
    <circle cx="120" cy="81" r="6" fill="#f59e0b" />
    <circle cx="140" cy="81" r="6" fill="#10b981" />
    <text x="400" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">chandila-core-architecture.php — Colombo to 15+ Countries</text>

    <!-- Code Lines Mockup -->
    <text x="105" y="140" fill="#38bdf8" font-family="Courier, monospace" font-size="14" font-weight="600">&lt;?php</text>
    <text x="105" y="170" fill="#f59e0b" font-family="Courier, monospace" font-size="14">class <tspan fill="#38bdf8">ChandilaWebDevelopment</tspan> {</text>
    <text x="135" y="200" fill="#94a3b8" font-family="Courier, monospace" font-size="13">const <tspan fill="#ec4899">ESTABLISHED</tspan> = 2016;</text>
    <text x="135" y="225" fill="#94a3b8" font-family="Courier, monospace" font-size="13">const <tspan fill="#ec4899">CLIENTS_SERVED</tspan> = '120+ Enterprises &amp; Startups';</text>
    <text x="135" y="250" fill="#94a3b8" font-family="Courier, monospace" font-size="13">const <tspan fill="#ec4899">GLOBAL_PRESENCE</tspan> = '15+ International Markets';</text>
    <text x="135" y="275" fill="#94a3b8" font-family="Courier, monospace" font-size="13">const <tspan fill="#ec4899">EXPANSION</tspan> = '5-Star Chandila Luxury Hotel';</text>

    <!-- Function block -->
    <text x="135" y="315" fill="#10b981" font-family="Courier, monospace" font-size="13">public function <tspan fill="#fbbf24">deliverImpact</tspan>(, ) {</text>
    <text x="165" y="340" fill="#e2e8f0" font-family="Courier, monospace" font-size="13">return <tspan fill="#38bdf8">self</tspan>::transformBusiness( = true);</text>
    <text x="135" y="365" fill="#10b981" font-family="Courier, monospace" font-size="13">}</text>
    <text x="105" y="395" fill="#f59e0b" font-family="Courier, monospace" font-size="14">}</text>

    <!-- Floating Badge Right Bottom -->
    <g transform="translate(470, 310)">
      <rect width="230" height="110" rx="14" fill="#0f172a" stroke="#d97706" stroke-width="2" />
      <text x="115" y="38" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" text-anchor="middle">8+ YEARS</text>
      <text x="115" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">OF EXCELLENCE</text>
      <text x="115" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Founded 2016 • Colombo, Sri Lanka</text>
    </g>
  </g>
</svg>