<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="trkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="20" fill="url(#trkBg)" stroke="#38bdf8" stroke-width="1.5" />
  <g transform="translate(50, 40)">
    <text x="250" y="35" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">JOB ID MILESTONE TRACKER</text>
    <text x="250" y="70" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle">Transparent 12-Stage Project Lifecycle</text>
    
    <!-- Timeline Line -->
    <line x1="40" y1="130" x2="460" y2="130" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="40" y1="130" x2="300" y2="130" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />

    <!-- Step 1 -->
    <circle cx="40" cy="130" r="14" fill="#10b981" />
    <text x="40" y="135" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
    <text x="40" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Submitted</text>

    <!-- Step 2 -->
    <circle cx="170" cy="130" r="14" fill="#10b981" />
    <text x="170" y="135" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
    <text x="170" y="165" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Confirmed</text>

    <!-- Step 3 Active -->
    <circle cx="300" cy="130" r="16" fill="#2563eb" stroke="#93c5fd" stroke-width="3" />
    <text x="300" y="135" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">▶</text>
    <text x="300" y="165" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">In Progress</text>

    <!-- Step 4 -->
    <circle cx="430" cy="130" r="14" fill="#334155" />
    <text x="430" y="135" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">12</text>
    <text x="430" y="165" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">Delivered</text>

    <!-- WhatsApp Box -->
    <rect x="60" y="200" width="380" height="55" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="250" y="225" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Automated WhatsApp Notifications</text>
    <text x="250" y="243" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Real-time alerts sent to your phone at every milestone</text>
  </g>
</svg>