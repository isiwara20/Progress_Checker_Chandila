<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="hotelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="hotelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="20" fill="url(#hotelBg)" stroke="#d97706" stroke-width="1.5" />
  
  <!-- 5 Stars -->
  <g transform="translate(185, 55)" fill="url(#hotelGold)">
    <text font-family="-apple-system, sans-serif" font-size="28" font-weight="bold">★ ★ ★ ★ ★</text>
  </g>

  <text x="300" y="130" fill="url(#hotelGold)" font-family="Georgia, serif" font-size="36" font-weight="bold" text-anchor="middle" letter-spacing="4">CHANDILA HOTEL</text>
  <text x="300" y="165" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="3">FIVE-STAR LUXURY HOSPITALITY</text>
  
  <line x1="180" y1="190" x2="420" y2="190" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.6" />

  <text x="300" y="225" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Expanding Horizons: Where Digital Innovation Meets Luxury Living</text>
  <text x="300" y="250" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Smart In-Room Automation • Global Guest Experiences • Colombo, Sri Lanka</text>

  <g transform="translate(200, 290)">
    <rect width="200" height="42" rx="21" fill="url(#hotelGold)" />
    <text x="100" y="26" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">UPCOMING LAUNCH</text>
  </g>
</svg>